# 默认场景：100m x 10m 走廊 + 双障碍物（与 v2 布局一致）
# 可用网页编辑器编辑：python main.py --editor
id: SceneDroneClassic
map:
  x_min: 0.0
  x_max: 100.0
  y_min: -5.0
  y_max: 5.0
  resolution: 0.5
start: [0.0, 0.0]
goal: [100.0, 0.0]
takeoff_height: -12.0
route:
  mode: line
obstacles:
  - name: Obstacle1
    x: 30.0
    y: 0.0
    w: 2.0
    h: 2.0
    height: 14.0
  - name: Obstacle2
    x: 65.0
    y: 0.0
    w: 2.0
    h: 2.0
    height: 14.0
