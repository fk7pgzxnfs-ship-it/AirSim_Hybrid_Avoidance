# ============================================================
# AirSim Hybrid Avoidance - 主配置文件
# ============================================================

# -------- AirSim 连接参数 --------
airsim:
  ip: "127.0.0.1"
  port: 41451
  vehicle_name: ""            # 空字符串表示默认车辆
  takeoff_height: -5.0        # 起飞高度（AirSim中Z轴向下，负值表示上升）

# -------- 地图与障碍物参数 --------
map:
  x_min: -20.0                # 地图X轴下限 (m)
  x_max: 20.0                 # 地图X轴上限 (m)
  y_min: -20.0                # 地图Y轴下限 (m)
  y_max: 20.0                 # 地图Y轴上限 (m)
  resolution: 0.5             # 栅格分辨率 (m/格)
  origin: [0.0, 0.0, -5.0]   # 地图原点 (x, y, z)，z为飞行高度

  # 静态障碍物列表：每个障碍物为 [x, y, 半径]
  obstacles:
    - [-3.0, -3.0, 1.0]
    - [2.0, 4.0, 1.5]
    - [5.0, -2.0, 1.0]
    - [-5.0, 5.0, 1.2]
    - [0.0, 8.0, 1.0]
    - [8.0, 0.0, 1.3]

# -------- A* 路径规划参数 --------
a_star:
  heuristic_weight: 1.2       # 启发式权重 (>1 使搜索更贪婪)
  diagonal_movement: true     # 是否允许对角线移动
  max_iterations: 50000       # 最大搜索迭代次数

# -------- 人工势场法参数（安全切换器） --------
potential_field:
  repulsive_gain: 50.0        # 斥力增益
  attractive_gain: 1.0        # 引力增益
  repulsive_range: 3.0        # 斥力作用范围 (m)
  safety_distance: 1.5        # 安全距离阈值 (m)，小于此值触发安全切换

# -------- 全局路径跟踪参数 --------
global_planner:
  lookahead_distance: 2.0     # 前视距离 (m)，用于选择下一个目标点
  waypoint_reach_threshold: 1.0  # 到达路点的判定阈值 (m)
  max_speed: 3.0              # 最大飞行速度 (m/s)

# -------- DRL 训练参数 --------
drl:
  algorithm: "ddpg"           # 可选: ddpg, sac, td3
  seed: 42                    # 随机种子

  # 环境参数
  env:
    max_steps: 500            # 每个episode最大步数
    state_dim: 8              # 状态空间维度
    action_dim: 2             # 动作空间维度 (vx, vy)
    action_low: [-2.0, -2.0]  # 动作下界
    action_high: [2.0, 2.0]   # 动作上界

  # 网络参数
  network:
    hidden_layers: [256, 256] # 隐藏层神经元数
    activation: "relu"        # 激活函数

  # 训练超参数
  training:
    learning_rate: 0.0003     # 学习率
    gamma: 0.99               # 折扣因子
    tau: 0.005                # 软更新系数
    batch_size: 64            # 批次大小
    buffer_size: 100000       # 经验回放缓冲区大小
    exploration_noise: 0.1    # 探索噪声标准差
    noise_decay: 0.995        # 噪声衰减率
    min_noise: 0.01           # 最小噪声值
    episodes: 2000            # 训练轮数
    warmup_steps: 1000        # 预热步数（纯随机探索）
    update_every: 2           # 每N步更新一次网络
    save_every: 100           # 每N轮保存一次模型

  # 奖励函数系数
  reward:
    goal_reward: 100.0        # 到达终点奖励
    collision_penalty: -50.0  # 碰撞惩罚
    step_penalty: -0.1        # 每步时间惩罚
    distance_gain: 1.0        # 距离变化奖励系数
    obstacle_penalty: -5.0    # 靠近障碍物惩罚

# -------- 模型保存路径 --------
model:
  save_dir: "models/drl_agent"
  load_checkpoint: ""         # 加载已有模型，空字符串表示从头训练

# -------- 日志参数 --------
logging:
  level: "info"               # 日志级别: debug, info, warning, error
  save_trajectory: true       # 是否保存飞行轨迹CSV
  save_interval: 5            # 日志记录间隔（步数）