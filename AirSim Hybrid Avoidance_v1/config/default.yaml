# -------- UE / Project AirSim ???? --------
airsim:
  ip: "127.0.0.1"
  port: 8990                 # UE ???? (Project AirSim)
  vehicle_name: "Drone1"     # ????????
  scene_id: "SceneDroneClassic"
  takeoff_height: -12.0      # ???? (NED, ?=?) 12m

# -------- ???????? (100m x 10m ??) --------
map:
  x_min: 0.0
  x_max: 100.0
  y_min: -5.0
  y_max: 5.0
  resolution: 0.5
  origin: [0.0, 0.0, -12.0]  # ?? (x, y, z)
  goal: [100.0, 0.0]        # ?? (x, y)

  # ?????: [x, y, ????]????? 2x2x14m???1m??
  # ??? 1.5m ??????A*/???
  obstacles:
    - [30.0, 0.0, 1.5]
    - [65.0, 0.0, 1.5]

  # ????????/LiDAR????: [x, y, ????]
  obstacles_physical:
    - [30.0, 0.0, 1.0]
    - [65.0, 0.0, 1.0]

# -------- A* ?????? --------
a_star:
  heuristic_weight: 1.2
  diagonal_movement: true
  max_iterations: 100000

# -------- ?????????????? --------
potential_field:
  repulsive_gain: 60.0
  attractive_gain: 1.0
  repulsive_range: 5.0
  safety_distance: 2.5

# -------- ???????? --------
global_planner:
  lookahead_distance: 4.0
  waypoint_reach_threshold: 1.2
  max_speed: 3.0

# -------- DRL ???? --------
drl:
  algorithm: "ddpg"
  seed: 42
  env:
    max_steps: 400
    state_dim: 8
    action_dim: 2
    action_low: [-2.0, -2.0]
    action_high: [2.0, 2.0]
  network:
    hidden_layers: [256, 256]
    activation: "relu"
  training:
    learning_rate: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 128
    buffer_size: 200000
    exploration_noise: 0.3
    noise_decay: 0.999
    min_noise: 0.05
    episodes: 1500
    warmup_steps: 1500
    update_every: 2
    save_every: 200
  reward:
    goal_reward: 120.0
    collision_penalty: -60.0
    step_penalty: -0.05
    distance_gain: 1.5
    obstacle_penalty: -6.0
    corridor_limit: 4.5
    corridor_penalty: 3.0

# -------- ?????? --------
model:
  save_dir: "models/drl_agent"
  load_checkpoint: "ddpg_best.pth"
  enable: true             # DRL ??????????? true?

# -------- ???? --------
logging:
  level: "info"
  save_trajectory: true
  save_interval: 5
