# ============================================================
# AirSim Hybrid Avoidance - v2.1 修复 DRL 直线段蛇形振荡
# 场景: 100m x 10m 走廊 + 双障碍物 (x=30, x=65)
# ============================================================

# -------- UE / Project AirSim 通信配置 --------
airsim:
  ip: "127.0.0.1"
  port: 8990                 # UE 端口 (Project AirSim)
  vehicle_name: "Drone1"     # 无人机名
  scene_id: "SceneDroneClassic"
  takeoff_height: -12.0      # 起飞高度 (NED, 上为正) 12m

# -------- 地图配置 (100m x 10m 走廊) --------
map:
  x_min: 0.0
  x_max: 100.0
  y_min: -5.0
  y_max: 5.0
  resolution: 0.5
  origin: [0.0, 0.0, -12.0]  # 起点 (x, y, z)
  goal: [100.0, 0.0]        # 终点 (x, y)

  # 规划障碍物: [x, y, 半径]（2x2x14m 等效半径 1m）
  # 半径 1.5m 用于膨胀 A*/势场
  obstacles:
    - [30.0, 0.0, 1.5]
    - [65.0, 0.0, 1.5]

  # 物理障碍物/LiDAR 等效: [x, y, 半径]
  obstacles_physical:
    - [30.0, 0.0, 1.0]
    - [65.0, 0.0, 1.0]

# -------- A* 全局规划参数 --------
a_star:
  heuristic_weight: 1.2
  diagonal_movement: true
  max_iterations: 100000

# -------- 势场/安全监控参数 --------
potential_field:
  repulsive_gain: 60.0
  attractive_gain: 1.0
  repulsive_range: 5.0
  safety_distance: 2.5

# -------- 全局规划器参数 --------
global_planner:
  lookahead_distance: 4.0
  waypoint_reach_threshold: 1.2
  max_speed: 3.0

# -------- DRL 训练配置 --------
drl:
  algorithm: "ddpg"
  seed: 42
  # v2.1: 训练仿真速度惯性保持 0.5s（与 v2.0 一致的训练动态，保证收敛）
  vel_time_constant: 0.5
  env:
    max_steps: 400
    state_dim: 8
    action_dim: 2
    action_low: [-2.0, -2.0]
    action_high: [2.0, 2.0]
  network:
    hidden_layers: [256, 256]
    activation: "relu"
  training:
    learning_rate: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 128
    buffer_size: 200000
    exploration_noise: 0.3
    noise_decay: 0.999
    min_noise: 0.05
    episodes: 1500
    warmup_steps: 1500
    update_every: 2
    save_every: 200
  reward:
    goal_reward: 120.0
    collision_penalty: -60.0
    step_penalty: -0.05
    distance_gain: 1.5
    obstacle_penalty: -6.0
    corridor_limit: 4.5
    corridor_penalty: 3.0
    # v2.1: 动作平滑惩罚（每步 |Δaction| 系数）与横向偏移惩罚（每米 |y| 系数）
    # 平滑惩罚促使策略输出平滑指令，消除部署端（fast-physics）蛇形轨迹
    action_smooth_penalty: 0.15
    lateral_penalty: 0.10

# -------- 模型配置 --------
model:
  save_dir: "models/drl_agent"
  load_checkpoint: "ddpg_best.pth"
  enable: true             # DRL 参与控制时置 true

# -------- 日志配置 --------
logging:
  level: "info"
  save_trajectory: true
  save_interval: 5
